name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 個人の値・秘匿情報の検査（CLAUDE.md「置かないもの」）。出力はファイル名・行番号・検査名だけ
      - name: 個人の値の検査のテスト
        run: .github/scripts/repo-values-check.test.sh
      # 値の検査: プロジェクト ID・番号は secret から（fork の PR では空 = その検査は飛ばす）。番号は先に伏せる
      - name: 個人の値の検査（形・オーナー名・プロジェクト ID・番号）
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          .github/scripts/log-mask.sh register
          if [[ $GCP_WIF_PROVIDER =~ ^projects/([0-9]+)/ ]]; then export GCP_PROJECT_NUMBER="${BASH_REMATCH[1]}"; fi
          .github/scripts/repo-values-check.sh .
      - name: ログのマスクのテスト
        run: .github/scripts/log-mask.test.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Terraform の検査（資格情報なし。init は backend なし、test はモックのプロバイダ）。apply はしない
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate（bootstrap）
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false -no-color
          terraform -chdir=infra/bootstrap validate -no-color
      - name: terraform test（bootstrap）
        run: terraform -chdir=infra/bootstrap test -no-color
      - name: IAM のリソースの宣言（bootstrap）
        run: .github/scripts/tf-iam-decl-check.sh
      - name: terraform validate（prod）
        run: |
          terraform -chdir=infra/prod init -backend=false -input=false -no-color
          terraform -chdir=infra/prod validate -no-color
      - name: terraform test（prod）
        run: terraform -chdir=infra/prod test -no-color
      - name: IAM のリソースの宣言（prod は 0 件）
        run: .github/scripts/tf-iam-decl-check.sh infra/prod
      - name: IAM のリソースの宣言の検査のテスト
        run: .github/scripts/tf-iam-decl-check.test.sh
      # plan SA の読み取りの権限で plan できるように、infra/prod は data source を持たない
      - name: infra/prod に data source が無い
        run: "! grep -rnE '^[[:space:]]*data[[:space:]]+\"' infra/prod --include='*.tf'"
      # deploy.yml のイメージのタグは image.sh paths の入力から決まる。.dockerignore の許可リストと食い違うと、
      # イメージの中身が変わってもタグが変わらない（デプロイされない）
      - name: イメージの入力と .dockerignore の一致
        run: |
          diff <(.github/scripts/image.sh paths | LC_ALL=C sort) \
            <({ sed -n 's/^!\(.*\)$/\1/p' .dockerignore | sed 's:/$::'; printf '%s\n' Dockerfile .dockerignore; } | LC_ALL=C sort)
          echo "タグ: $(.github/scripts/image.sh tag)"
      # コンテナイメージのビルドと検査（非 root・/app の中身・/health・未認証 401・SIGTERM で終了コード 0）。push はしない
      - name: イメージのビルド
        run: docker build -t dispatcher:ci .
      - name: イメージの検査
        run: .github/scripts/image-check.sh dispatcher:ci

  # PR の plan（plan SA。読み取りだけ）。同じリポジトリからの PR だけ（fork の PR に OIDC のトークンを渡さない）。
  # deploy.yml の plan job と同じ手順（片方を直したらもう片方も直す）。要約はアドレスと操作だけ。必須の check にはしない
  terraform-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      GCP_SA: ${{ vars.GCP_SA_TF_PLAN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_IN_AUTOMATION: "1"
    steps:
      - name: 設定の確認
        id: cfg
        run: |
          missing=""
          [ -n "$GCP_PROJECT_ID" ] || missing+=" secrets.GCP_PROJECT_ID"
          [ -n "$GCP_WIF_PROVIDER" ] || missing+=" secrets.GCP_WIF_PROVIDER"
          [ -n "$TF_STATE_BUCKET" ] || missing+=" vars.TF_STATE_BUCKET"
          [ -n "$GCP_SA" ] || missing+=" vars.GCP_SA_TF_PLAN"
          if [ -n "$missing" ]; then
            echo "::notice::未設定（${missing# }）なので plan をスキップする（infra/README.md「GitHub の設定」）"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - name: プロジェクト番号を伏せる
        if: steps.cfg.outputs.enabled == 'true'
        run: .github/scripts/log-mask.sh register
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.cfg.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_TF_PLAN }}
      - name: イメージの解決
        id: image
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          .github/scripts/image.sh resolve > "$RUNNER_TEMP/image.env"
          grep -E '^(tag|exists)=' "$RUNNER_TEMP/image.env" >> "$GITHUB_OUTPUT"
          # image= はプロジェクト ID を含むので、出力にせず環境変数で渡す
          sed -n 's/^image=/TF_VAR_image=/p' "$RUNNER_TEMP/image.env" >> "$GITHUB_ENV"
      # plan SA は state を読むだけ（objectViewer）なので -lock=false
      - name: terraform plan（plan SA）
        if: steps.cfg.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.image.outputs.tag }}
          EXISTS: ${{ steps.image.outputs.exists }}
        run: |
          if ! terraform -chdir=infra/prod init -input=false -no-color -backend-config="bucket=$TF_STATE_BUCKET" > "$RUNNER_TEMP/init.log" 2>&1; then
            echo "::error::terraform init が失敗した（末尾をマスクして出す）"
            tail -n 40 "$RUNNER_TEMP/init.log" | .github/scripts/log-mask.sh filter
            exit 1
          fi
          rc=0
          terraform -chdir=infra/prod plan -lock=false -input=false -no-color -detailed-exitcode -out=prod.tfplan > "$RUNNER_TEMP/plan.log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::terraform plan が失敗した（exit $rc。末尾をマスクして出す）"
            tail -n 40 "$RUNNER_TEMP/plan.log" | .github/scripts/log-mask.sh filter
            exit 1
          fi
          {
            echo "### terraform plan（infra/prod。PR）"
            echo
            echo "- イメージのタグ: \`$TAG\`（Artifact Registry に $([ "$EXISTS" = true ] && echo 'あり' || echo '未作成。マージの後の deploy.yml でビルドして push する')）"
            echo
            .github/scripts/tf-plan-summary.sh infra/prod/prod.tfplan
          } >> "$GITHUB_STEP_SUMMARY"
