name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 個人の値・秘匿情報の検査（CLAUDE.md「置かないもの」）。出力はファイル名・行番号・検査名だけ
      - name: 個人の値の検査のテスト
        run: .github/scripts/repo-values-check.test.sh
      - name: 個人の値の検査（形・オーナー名）
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: .github/scripts/repo-values-check.sh .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
